<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ezz Upholstery</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* الأنماط العامة */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 100%);
      color: #2c3e50;
      line-height: 1.6;
    }

    header {
      background-color: #34495e;
      color: white;
      padding: 20px 0;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 999;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .language-switch {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .language-switch button {
      background: #1abc9c;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .language-switch button:hover {
      background: #16a085;
      transform: scale(1.05);
    }

    .container {
      max-width: 1200px;
      margin: 100px auto 40px auto;
      padding: 0 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .item {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      padding: 20px;
    }

    .item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: transform 0.3s ease;
      border-radius: 12px;
    }

    .item:hover img {
      transform: scale(1.05);
    }

    .item:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 12px;
    }

    .item:hover .overlay {
      opacity: 1;
    }

    .overlay-text {
      font-size: 18px;
      text-align: center;
      font-weight: 600;
      text-transform: uppercase;
    }

    .contact-info {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      color: #34495e;
    }

    .contact-info a {
      color: #1abc9c;
      font-weight: bold;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    /* Media Queries for Responsive Design */
    @media (max-width: 1024px) {
      header h1 {
        font-size: 28px;
      }

      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }

      .item img {
        height: 200px;
      }
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 24px;
      }

      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      }

      .item img {
        height: 180px;
      }

      .language-switch button {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 22px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .item img {
        height: 150px;
      }

      .language-switch button {
        font-size: 12px;
        padding: 8px 15px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="title">Ezz Upholstery</h1>
  </header>

  <div class="language-switch">
    <button onclick="toggleLanguage()">English</button>
  </div>

  <div class="container">
    <p id="instruction">اضغط على أي صورة للتواصل معنا</p>
    <div class="gallery" id="gallery">
      <!-- الصور بتتحط هنا -->
    </div>
    <div class="contact-info" id="contact-info">
      <!-- رقم التواصل و التفاصيل هيظهروا هنا -->
    </div>
  </div>

  <script>
    const images = [
      "https://images.unsplash.com/photo-1586023492125-27b2c045efd7",
      "https://images.unsplash.com/photo-1598300051453-603b7be06b4f",
      "https://images.unsplash.com/photo-1582582494700-1f27c2984d3d"
    ];

    const phoneNumber = "201234567890";
    const instagramURL = "https://www.instagram.com/ezz_upholstery1?igsh=cjhzdGpuem02bjg0";

    const gallery = document.getElementById("gallery");
    const contactInfo = document.getElementById("contact-info");
    const title = document.getElementById("title");
    const instruction = document.getElementById("instruction");
    const langButton = document.querySelector(".language-switch button");

    let isArabic = true;

    function renderGallery() {
      gallery.innerHTML = "";
      images.forEach(url => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <img src="${url}" alt="Furniture">
          <div class="overlay">
            <div class="overlay-text">${isArabic ? "اضغط للسؤال عن السعر" : "Click to inquire about the price"}</div>
          </div>
        `;
        div.onclick = () => {
          // فتح إنستجرام مباشرة
          window.open(instagramURL, "_blank");
        };
        gallery.appendChild(div);
      });
      
      // Update contact info dynamically
      updateContactInfo();
    }

    function updateContactInfo() {
      contactInfo.innerHTML = `
        <p>${isArabic ? "لأي استفسارات أو مشاكل، يمكنكم الاتصال على:" : "For any inquiries or issues, you can contact us at:"}</p>
        <p><a href="tel:+${phoneNumber}">${phoneNumber}</a></p>
        <p>${isArabic ? "يرجى الاتصال بنا عبر الهاتف إذا كنت بحاجة إلى مساعدة." : "Please contact us by phone if you need assistance."}</p>
      `;
    }

    function toggleLanguage() {
      isArabic = !isArabic;
      if (isArabic) {
        document.body.dir = "rtl";
        document.documentElement.lang = "ar";
        title.textContent = "Ezz Upholstery";
        instruction.textContent = "اضغط على أي صورة للتواصل معنا";
        langButton.textContent = "English";
      } else {
        document.body.dir = "ltr";
        document.documentElement.lang = "en";
        title.textContent = "Ezz Upholstery";
        instruction.textContent = "Click any image to contact us";
        langButton.textContent = "العربية";
      }
      renderGallery();
    }

    renderGallery();
  </script>

</body>
</html>
